<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>文湖線月台門訓練機 V5.0 (後台可編排練習版)</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <!-- 頂部控制與狀態列 -->
    <header class="top-control-bar">
        <div class="instructor-row">
            <select id="scenario-selector" aria-label="選擇模擬狀況"></select>
            <div class="btn-group">
                <button type="button" class="btn-action" id="btn-trigger">發送狀況</button>
                <button type="button" class="btn-action green" id="btn-reset">系統復原</button>
                <button type="button" class="btn-action blue" id="btn-hint" title="查看目前步驟提示">💡 提示</button>
                <button type="button" class="btn-action dark icon-only" id="btn-mute" title="音效已開啟（點擊靜音）">🔊</button>
                <button type="button" class="btn-action dark" id="btn-open-admin">⚙️ 教官後台</button>
            </div>
        </div>
        <div class="status-row level-normal" id="status-container">
            <span id="status-text">🟢 系統正常，列車待命中。</span>
            <span id="step-progress-badge" class="step-progress-badge idle">自由模式</span>
            <div class="hold-progress-track">
                <div class="hold-progress-fill" id="hold-progress-fill"></div>
            </div>
        </div>
    </header>

    <!-- 硬體面板主區 -->
    <main class="panel-wrapper">
        <div class="hardware-panel" id="panel-container" oncontextmenu="return false;">
            <!-- 由 app.js 動態渲染全部 44 個互動硬體元件 -->
        </div>
    </main>

    <!-- 教官後台管理介面 (免寫程式編輯劇本) -->
    <section class="admin-modal" id="admin-modal" aria-label="教官後台管理">
        <div class="admin-topbar">
            <div class="admin-topbar-title">
                <span>⚙️ 教官後台 — 模擬劇本管理系統</span>
            </div>
            <div class="admin-topbar-actions">
                <button type="button" class="btn-admin success" id="btn-admin-save">💾 本機儲存</button>
                <button type="button" class="btn-admin cloud" id="btn-admin-publish" title="一鍵將題庫發布到網路，讓所有手機自動同步">☁️ 發布到網路</button>
                <button type="button" class="btn-admin primary" id="btn-admin-export" title="下載 scenarios.json 備份檔">📥 下載 JSON</button>
                <button type="button" class="btn-admin" id="btn-admin-import">📤 匯入 JSON</button>
                <button type="button" class="btn-admin warning" id="btn-admin-reset-default" title="清除本機草稿並重新載入雲端最新題庫">🔄 同步雲端</button>
                <button type="button" class="btn-admin" id="btn-admin-logout" title="鎖定教官後台並登出">🔒 登出</button>
                <button type="button" class="btn-admin danger" id="btn-close-admin">✕ 關閉返回面板</button>
                <input type="file" id="input-import-json" accept=".json,application/json" style="display:none;">
            </div>
        </div>

        <div class="admin-body">
            <aside class="admin-sidebar">
                <div class="admin-sidebar-header">
                    <strong>模擬劇本清單</strong>
                    <button type="button" class="btn-admin success" id="btn-admin-add">＋ 新增劇本</button>
                </div>
                <div class="admin-scenario-list" id="admin-scenario-list"></div>
            </aside>

            <div class="admin-editor-pane" id="admin-editor-pane"></div>
        </div>

        <div class="admin-toast" id="admin-toast"></div>
    </section>

    <!-- 教官後台密碼登入視窗 -->
    <div class="publish-dialog-backdrop" id="login-dialog">
        <div class="publish-dialog" style="max-width: 360px;">
            <div class="publish-dialog-header">
                <h3>🔐 教官後台登入</h3>
                <button type="button" class="mini-btn danger" id="btn-close-login">✕</button>
            </div>
            <p class="section-hint">請輸入教官密碼以編輯演練程序並啟用雲端一鍵發布功能。</p>
            <div class="form-row">
                <label for="admin-password-input">教官密碼</label>
                <input type="password" id="admin-password-input" inputmode="numeric" autocomplete="current-password" placeholder="請輸入密碼">
            </div>
            <div class="publish-status-box" id="login-status-box"></div>
            <div class="publish-dialog-actions">
                <button type="button" class="btn-admin" id="btn-cancel-login">取消</button>
                <button type="button" class="btn-admin cloud" id="btn-confirm-login">🔓 登入後台</button>
            </div>
        </div>
    </div>

    <script src="./components.js"></script>
    <script src="./default-scenarios.js"></script>
    <script src="./github-sync.js"></script>
    <script src="./engine.js"></script>
    <script src="./admin.js"></script>
    <script src="./app.js"></script>
</body>
</html>
